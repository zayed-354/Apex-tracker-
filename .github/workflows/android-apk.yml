
name: Build APEX TRACKER APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html style.css script.js www/
          cp manifest.json service-worker.js www/
          cp icon-192.png icon-512.png www/
          npm init -y
          npm install @capacitor/core@^7 @capacitor/android@^7
          npm install --save-dev @capacitor/cli@^7

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.apextracker.app",
            "appName": "APEX TRACKER",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APEX-TRACKER-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
